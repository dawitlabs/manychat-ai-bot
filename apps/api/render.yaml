services:
  - type: web
    name: kyle-api
    runtime: node
    region: oregon
    plan: starter
    rootDir: apps/api
    buildCommand: pnpm install --frozen-lockfile && pnpm build && pnpm db:migrate
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false  # Required — server refuses to boot without it
      - key: MANYCHAT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MANYCHAT_API_KEY
        sync: false  # Optional — enables manual send from the dashboard
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NODE_ENV
        value: production
